NCIA MACHISTA CONTRA LAS MUJERES, ADEMÁS DE LAS PRESTACIONES ECONÓMICAS, DE CARÁCTER GENERA L A LAS QUE TENGAN ACCESO, LAS ADMINISTRACIONES PÚBLICAS VASCAS HAN DE GARANTIZAR A LAS VÍCTIMAS DE VIOLENCIA MACHISTA CONTRA LAS MUJERES EL ACCESO A LAS SIGUIENTES AYUDAS ECONÓMICAS ESPECÍFICAS:", "options": ["Ayudas de pago único para víctimas que acrediten insuficiencia de recursos económicos y unas especiales dificultades para obtener empleo.", "Ayuda económica para los hijos e hijas huérfanas de víctimas mortales de la violencia machista contra las mujeres.", "Ayudas extraordinarias para paliar situaciones de necesidad personal que sean evaluables y verificables, siempre que se haya observado por los órganos competentes la inexistencia o insuficiencia del montante de las ayudas ordinarias previstas.", "Todas las respuestas son correctas."], "correct": 3}, {"id": 337, "theme_id": 10, "theme_title": "DECRETO LEGISLATIVO 1/2023, DE 16 DE MARZO, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES. V PLAN MUNICIPAL PARA LA IGUALDAD DE MUJERES Y HOMBRES DEL AYUNTAMIENTO DE BILBAO.", "text": "SEGÚN EL ARTÍCULO 71 DEL DECRETO LEGISLATIVO 1/2023, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES, PUEDE CONSTITUIR IMPEDIMENTO PARA DIRIGIRSE A EMAKUNDE-INSTITUTO VASCO DE LA MUJER:", "options": ["La nacionalidad.", "La residencia.", "La edad.", "Ninguna de las respuestas anteriores es correcta."], "correct": 3}, {"id": 338, "theme_id": 10, "theme_title": "DECRETO LEGISLATIVO 1/2023, DE 16 DE MARZO, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES. V PLAN MUNICIPAL PARA LA IGUALDAD DE MUJERES Y HOMBRES DEL AYUNTAMIENTO DE BILBAO.", "text": "SEGÚN EL ARTÍCULO 71 DEL DECRETO LEGISLATIVO 1/2023, POR EL QUE S L V PLAN MUNICIPAL PARA LA IGUALDAD DE MUJERES Y HOMBRES ELABORADO POR EL AYUNTAMIENTO DE BILBAO, HA SIDO RESULTADO DE UN PROCESO, CONTINUADO Y SOSTENIDO EN EL TIEMPO, QUE HA CONTADO CON EL APOYO Y PARTICIPACIÓN DEL:", "options": ["Movimiento feminista y de las asociaciones de comerciantes de Bilbao.", "Movimiento feminista y de las asociaciones de barrios de Bilbao.", "Movimiento feminista y de las asociaciones de mujeres de Bilbao.", "Todas las respuestas son correctas."], "correct": 2}, {"id": 344, "theme_id": 10, "theme_title": "DECRETO LEGISLATIVO 1/2023, DE 16 DE MARZO, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES. V PLAN MUNICIPAL PARA LA IGUALDAD DE MUJERES Y HOMBRES DEL AYUNTAMIENTO DE BILBAO.", "text": "EL V PLAN MUNICIPAL PARA LA IGUALDAD DE MUJERES Y HOMBRES ELABORADO POR EL AYUNTAMIENTO DE BILBAO SE BASA EN CINCO PRINCIPIOS RECTORES: (MARCAR LA RESPUESTA INCORRECTA)", "options": ["La igualdad de trato y de oportunidades.", "La eliminación de roles y estereotipos en función del sexo.", "El respeto a la igualdad.", "El respeto a la diversidad y a la diferencia."], "correct": 2}, {"id": 345, "theme_id": 10, "theme_title": "DECRETO LEGISLATIVO 1/2023, DE 16 DE MARZO, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES. V PLAN MUNICIPAL PARA LA IGUALDAD DE MUJERES Y HOMBRES DEL AYUNTAMIENTO DE BILBAO.", "text": "EL V PLAN MUNICIPAL PARA LA IGUALDAD DE MUJERES Y HOMBRES ELABORADO POR EL AYUNTAMIENTO DE BILBAO, ESTABLECE QUE DE MANERA ESPECÍFICA SERVIRÁ DE ORIENTACIÓN EN LA ACTUACIÓN MUNICIPAL EL DERECHO A LA ASISTENCIA, PROTECCIÓN, INVESTIGACIÓN, RECUPERACIÓN  Y REPARACIÓN DE LAS MUJERES QUE HAYAN ENFRENTADO VIOLENCIAS:", "options": ["Tomando en consideración las necesidades, experiencias y particularidades específicas de cada una de las mujeres desde un enfoque de interseccionalidad.", "Y mediante el desarrollo de instrumentos de coordinación y colaboración con las instituciones, con sociedad civil, organizaciones sociales y en especial como el movimiento asociativo de mujeres y feministas.", "En todo caso, como condición imprescindible para la consecución de la igualdad.", "Las respuestas a) y b) son correctas."], "correct": 3}, {"id": 346, "theme_id": 10, "theme_title": "DECRETO LEGISLATIVO 1/2023, DE 16 DE MARZO, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES. V PLAN MUNICIPAL PARA LA IGUALDAD DE MUJERES Y HOMBRES DEL AYUNTAMIENTO DE BILBAO.", "text": "EL SEGUNDO GRAN EJE DE ACTUACIÓN SOBRE EL QUE SE HA ESTRUCTURADO EL V PLAN MUNICIPAL PARA LA IGUALDAD DE MUJERES Y HOMBRES SE REFIERE A LAS POLÍTICAS ESPECÍFICAS DE IGUALDAD Y ACCIONES POSITIVAS:", "options": ["En el que se recoge un conjunto de medidas dirigidas a incorporar la perspectiva de género, desde un enfoque sectorial, en todas las políticas que se diseñen, se implementen y se evalúen en el ámbito de las competencias municipales y que sean necesarias para erradicar toda discriminación por razón de género detectada.", "En el que se recoge un conjunto de medidas dirigidas a incorporar la perspectiva de género, desde un enfoque interseccional, en todas las políticas sectoriales que se diseñen, se implementen y se evalúen en el ámbito de las competencias municipales, incluyendo acciones positivas, y que sean necesarias para erradicar toda discriminación por razón de género detectada.", "En el que se recoge un conjunto de medidas dirigidas a incorporar acciones positivas, desde un enfoque intersectorial, en todas las políticas que se diseñen, se implementen y se evalúen en el ámbito de las competencias municipales y que sean necesarias para erradicar toda discriminación por razón de género detectada.", "Todas las respuestas son correctas."], "correct": 1}, {"id": 347, "theme_id": 10, "theme_title": "DECRETO LEGISLATIVO 1/2023, DE 16 DE MARZO, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES. V PLAN MUNICIPAL PARA LA IGUALDAD DE MUJERES Y HOMBRES DEL AYUNTAMIENTO DE BILBAO.", "text": "EL V PLAN MUNICIPAL PARA LA IGUALDAD DE MUJERES Y HOMBRES ELABORADO POR EL AYUNTAMIENTO DE BILBAO, ESTABLECE EL DERECHO A LA ASISTENCIA, PROTECCIÓN, INVESTIGACIÓN, RECUPERACIÓN Y REPARACIÓN DE LAS MUJERES QUE HAYAN ENFRENTADO VIOLENCIAS:", "options": ["Mediante el desarrollo de instrumentos de coordinación y colaboración con las instituciones, con sociedad civil, organizaciones sociales y en especial como el movimiento asociativo de mujeres y feministas.", "Mediante el desarrollo de instrumentos de coordinación y colaboración con las instituciones, organizaciones económicas y sociales y en especial como el movimiento asociativo de mujeres y feministas.", "Mediante el desarrollo de instrumentos de coordinación y colaboración con las instituciones, organizaciones civiles y en especial como las asociaciones de barrios de mujeres.", "Todas las respuestas son correctas."], "correct": 0}, {"id": 348, "theme_id": 10, "theme_title": "DECRETO LEGISLATIVO 1/2023, DE 16 DE MARZO, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA CONTRA LAS MUJERES. V PLAN MUNICIPAL PARA LA IGUALDAD DE MUJERES Y HOMBRES DEL AYUNTAMIENTO DE BILBAO.", "text": "EL V PLAN MUNICIPAL PARA LA IGUALDAD DE MUJERES Y HOMBRES ELABORADO POR EL AYUNTAMIENTO DE BILBAO, INCLUYE COMO ASPECTOS A SEGUIR PROFUNDIZANDO:", "options": ["Presupuestos con perspectiva de género.", "Evaluación previa de impacto de género.", "Definición y consolidación de estructuras para la implementación de las políticas de igualdad.", "Todas las respuestas son correctas."], "correct": 3}, {"id": 349, "theme_id": 10, "theme_title": "DECRETO LEGISLATIVO 1/2023,                                     <div className="flex items-center space-x-2">
                                        <span className="text-xs font-bold px-2.5 py-1 rounded-md bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                                            {isReviewing ? 'Modo Repaso de Fallos' : 'En Curso'}
                                        </span>
                                        <span className="text-xs text-slate-400 font-medium truncate max-w-xs sm:max-w-md">
                                            {currentBlockTitle}
                                        </span>
                                    </div>

                                    {/* Contadores de Aciertos/Errores */}
                                    <div className="flex items-center space-x-4 text-xs font-bold">
                                        <div className="flex items-center space-x-1.5 text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-lg border border-emerald-500/20">
                                            <i className="fa-solid fa-check"></i>
                                            <span>{stats.correct}</span>
                                        </div>
                                        <div className="flex items-center space-x-1.5 text-rose-400 bg-rose-500/10 px-2.5 py-1 rounded-lg border border-rose-500/20">
                                            <i className="fa-solid fa-xmark"></i>
                                            <span>{stats.failed}</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Barra de Progreso Dinámica */}
                                <div className="space-y-1.5">
                                    <div className="flex justify-between text-xs text-slate-400 font-medium">
                                        <span>Pregunta {currentIndex + 1} de {questionsQueue.length}</span>
                                        <span>{Math.round(progressPct)}%</span>
                                    </div>
                                    <div className="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
                                        <div 
                                            className="bg-gradient-to-r from-indigo-500 to-indigo-600 h-full rounded-full transition-all duration-300 shadow-sm"
                                            style={{ width: `${progressPct}%` }}
                                        ></div>
                                    </div>
                                </div>
                            </div>

                            {/* Tarjeta de la Pregunta Activa */}
                            <div className="glass-card rounded-2xl p-6 sm:p-8 mb-6 border border-slate-800 shadow-xl relative">
                                <div className="flex items-start justify-between gap-4 mb-4">
                                    <span className="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-800 text-slate-400 border border-slate-700">
                                        Nº {currentQuestion.id}
                                    </span>
                                    {isReviewing && (
                                        <span className="text-xs font-semibold px-2.5 py-1 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center space-x-1">
                                            <i className="fa-solid fa-rotate-right"></i>
                                            <span>Repaso de Fallo</span>
                                        </span>
                                    )}
                                </div>

                                <h3 className="text-base sm:text-lg font-semibold text-slate-100 leading-relaxed mb-6">
                                    {currentQuestion.text}
                                </h3>

                                {/* Lista de Opciones Aleatorizadas */}
                                <div className="space-y-3">
                                    {shuffledOptions.map((opt, idx) => {
                                        const letterLabel = String.fromCharCode(97 + idx); // a, b, c, d
                                        const isSelected = selectedId === opt.id;
                                        
                                        // Estilos según el estado de la respuesta
                                        let btnStyle = "border-slate-700/80 bg-slate-800/40 hover:bg-slate-800 text-slate-200 hover:border-slate-600";
                                        let badgeStyle = "bg-slate-800 text-slate-400 border-slate-700";

                                        if (hasAnsweredCurrent) {
                                            if (opt.isCorrect) {
                                                btnStyle = "border-emerald-500/80 bg-emerald-500/10 text-emerald-200 shadow-lg shadow-emerald-500/10 font-medium";
                                                badgeStyle = "bg-emerald-500 text-slate-950 font-bold border-emerald-400";
                                            } else if (isSelected && !opt.isCorrect) {
                                                btnStyle = "border-rose-500/80 bg-rose-500/10 text-rose-200 shadow-lg shadow-rose-500/10";
                                                badgeStyle = "bg-rose-500 text-white font-bold border-rose-400";
                                            } else {
                                                btnStyle = "border-slate-800 bg-slate-900/30 text-slate-500 opacity-60";
                                                badgeStyle = "bg-slate-800 text-slate-600 border-slate-800";
                                            }
                                        }

                                        return (
                                            <button
                                                key={opt.id}
                                                disabled={hasAnsweredCurrent}
                                                onClick={() => handleSelectOption(opt)}
                                                className={`p-4 rounded-xl border w-full text-left transition-all duration-200 flex items-start space-x-3.5 group ${btnStyle}`}
                                            >
                                                <span className={`w-6 h-6 rounded-lg text-xs flex items-center justify-center shrink-0 border mt-0.5 font-bold uppercase transition-colors ${badgeStyle}`}>
                                                    {letterLabel}
                                                </span>
                                                <span className="text-sm leading-snug flex-1">
                                                    {opt.text}
                                                </span>

                                                {/* Icono indicador al responder */}
                                                {hasAnsweredCurrent && (
                                                    <span className="shrink-0 pt-0.5">
                                                        {opt.isCorrect && <i className="fa-solid fa-circle-check text-emerald-400 text-base"></i>}
                                                        {isSelected && !opt.isCorrect && <i className="fa-solid fa-circle-xmark text-rose-400 text-base"></i>}
                                                    </span>
                                                )}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Botón Siguiente Pregunta */}
                            <div className="flex justify-end">
                                <button
                                    disabled={!hasAnsweredCurrent}
                                    onClick={handleNext}
                                    className={`px-6 py-3 rounded-xl font-semibold text-sm flex items-center space-x-2 transition-all duration-200 ${
                                        hasAnsweredCurrent 
                                            ? 'bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white shadow-lg shadow-indigo-600/30 cursor-pointer' 
                                            : 'bg-slate-800 text-slate-500 border border-slate-700/50 cursor-not-allowed opacity-50'
                                    }`}
                                >
                                    <span>
                                        {currentIndex + 1 < questionsQueue.length 
                                            ? 'Siguiente Pregunta' 
                                            : (failedQueue.length > 0 ? 'Iniciar Repaso de Fallos' : 'Finalizar Examen')
                                        }
                                    </span>
                                    <i className="fa-solid fa-arrow-right text-xs"></i>
                                </button>
                            </div>
                        </main>
                    )}

                    {/* VISTA 3: RESULTADOS / FINALIZACIÓN */}
                    {view === 'result' && (
                        <main className="max-w-2xl mx-auto px-4 py-12 flex-1 w-full flex items-center justify-center animate-fade-in">
                            <div className="glass-card rounded-3xl p-8 sm:p-10 text-center border border-indigo-500/30 shadow-2xl relative overflow-hidden w-full">
                                <div className="w-20 h-20 bg-emerald-500/10 text-emerald-400 rounded-3xl flex items-center justify-center mx-auto mb-6 border border-emerald-500/20 shadow-lg shadow-emerald-500/20">
                                    <i className="fa-solid fa-trophy text-3xl"></i>
                                </div>

                                <h2 className="text-2xl sm:text-3xl font-extrabold text-white mb-2">
                                    ¡Bloque Completado con Éxito!
                                </h2>
                                <p className="text-slate-400 text-sm mb-8">
                                    Has respondido correctamente a todas las preguntas de este bloque.
                                </p>

                                {/* Resumen Estadístico */}
                                <div className="grid grid-cols-3 gap-4 mb-8 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
                                    <div className="p-3">
                                        <p className="text-xs text-slate-400 font-medium mb-1">Intentos Totales</p>
                                        <p className="text-xl font-bold text-slate-200">{stats.answered}</p>
                                    </div>
                                    <div className="p-3 border-x border-slate-800">
                                        <p className="text-xs text-emerald-400 font-medium mb-1">Aciertos</p>
                                        <p className="text-xl font-bold text-emerald-400">{stats.correct}</p>
                                    </div>
                                    <div className="p-3">
                                        <p className="text-xs text-rose-400 font-medium mb-1">Errores Corregidos</p>
                                        <p className="text-xl font-bold text-rose-400">{stats.failed}</p>
                                    </div>
                                </div>

                                <button
                                    onClick={handleReturnToMenu}
                                    className="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/30 transition-all duration-200 flex items-center justify-center space-x-2"
                                >
                                    <i className="fa-solid fa-house text-sm"></i>
                                    <span>Volver al Menú Principal</span>
                                </button>
                            </div>
                        </main>
                    )}

                    {/* Pie de página */}
                    <footer className="border-t border-slate-800/80 bg-slate-950/60 py-4 text-center text-xs text-slate-500">
                        <div className="max-w-7xl mx-auto px-4">
                            Simulador Interactivo de Exámenes OPE Bilbao &bull; Desarrollado bajo especificaciones SPA Single-File
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
